services:
  sensitive-filter:
    image: local-sensitive-filter:latest
    container_name: sensitive-filter
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    volumes:
      - ./data/words.json:/app/data/words.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
