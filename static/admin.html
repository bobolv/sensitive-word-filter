<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词库管理</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="shell"><section id="login" class="card login"><h1>维护人员登录</h1><p>请输入管理员密码以维护本地敏感词库。</p><input id="password" class="field" type="password" placeholder="管理员密码"><button id="loginBtn" class="primary">登录</button></section>
<section id="manager" class="hidden"><header><div><h1>敏感词库管理</h1><p>指定替换词优先于用户输入的统一替换内容</p></div><button id="logout" class="secondary">退出登录</button></header><div class="card"><div class="admin-actions"><button id="add" class="secondary">添加词条</button><button id="save" class="primary">保存词库</button></div><table class="admin-table"><thead><tr><th>敏感词</th><th>分类</th><th>等级</th><th>指定替换词（可空）</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="toast" class="toast"></div><script src="/static/admin.js"></script></body></html>
